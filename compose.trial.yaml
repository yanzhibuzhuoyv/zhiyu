name: zhiyu-companion-trial
services:
  backend:
    image: zhiyu-backend:warm-trial
    build:
      context: ./backend
      target: runtime
      args:
        PYTHON_IMAGE: python:3.13-slim@sha256:7ce4b6dfe35e55397b7cda544f8a13f191b7ae28dc5aad71fe664dbc9bc2623f
    ports:
      - "127.0.0.1:8798:8790"
    environment:
      ZHIYU_DEMO: "false"
      ZHIYU_SESSION_HOURS: "24"
      ZHIYU_AUTO_MEMORY_ANNOTATIONS: "true"
      ZHIYU_MEMORY_ANNOTATION_MODE: "semantic"
    volumes:
      - trial-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
volumes:
  trial-data:
