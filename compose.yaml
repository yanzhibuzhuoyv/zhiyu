services:
  backend:
    build:
      context: ./backend
      target: runtime
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      ZHIYU_MEDIA_DIR: /media
      ZHIYU_DEMO: "false"
      ZHIYU_SESSION_HOURS: "24"
      ZHIYU_AUTO_MEMORY_ANNOTATIONS: "${ZHIYU_AUTO_MEMORY_ANNOTATIONS:-true}"
      ZHIYU_MEMORY_ANNOTATION_MODE: "${ZHIYU_MEMORY_ANNOTATION_MODE:-semantic}"
    volumes:
      - zhiyu-data:/data
      - zhiyu-media:/media
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
volumes:
  zhiyu-data:
  zhiyu-media:
