services:
  backend:
    build:
      context: ./backend
      target: runtime
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      ZHIYU_DEMO: "false"
      ZHIYU_SESSION_HOURS: "24"
    volumes:
      - zhiyu-data:/data
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
volumes:
  zhiyu-data:
